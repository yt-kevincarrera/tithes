name: Release

# Publica un APK firmado cada vez que se empuja una etiqueta v*.
#
# Es la otra mitad del actualizador: la app busca la última release de este
# repositorio y descarga el APK que se adjunta aquí.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar (ej. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Los tests de la capa de datos abren SQLite en memoria y necesitan la
      # librería nativa.
      - name: SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Generar el código de Drift
        run: dart run build_runner build

      - name: Tests
        run: flutter test

      # La firma tiene que ser la misma en todas las versiones o Android se
      # niega a actualizar la app en sitio.
      - name: Restaurar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/diezmo-release.jks

      # Un APK por arquitectura, no uno universal: el universal lleva las tres
      # dentro y pesa el triple. La app elige el suyo por el nombre del asset.
      - name: Compilar los APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/diezmo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RATES_ENDPOINT: ${{ vars.RATES_ENDPOINT }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=RATES_ENDPOINT="$RATES_ENDPOINT" \
            --dart-define=UPDATE_REPO="$GITHUB_REPOSITORY"

      - name: Renombrar los APK con su versión
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ inputs.tag }}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/diezmo-$VERSION-$abi.apk"
            fi
          done
          ls -la dist
          # Sin APK no hay release que publicar.
          [ -n "$(ls -A dist)" ]

      - name: Comprobar que la clave no se coló en el repo
        run: |
          if git ls-files --error-unmatch android/diezmo-release.jks >/dev/null 2>&1; then
            echo "La clave de firma está versionada en git. Sácala del repo."
            exit 1
          fi

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
